research_period:
  겨울: {option: 평균 ± 1주, start: 11-27, end: 03-10, train_coverage: 0.919, eval_coverage: 1.0}
  여름: {option: 평균, start: 05-09, end: 09-23, train_coverage: 0.917, eval_coverage: 1.0}

periods:
  - {season: 2022-23_winter, split: train, start: 2022-11-27, end: 2023-03-10, baseline_start: 2022-10-30}
  - {season: 2023_summer, split: train, start: 2023-05-09, end: 2023-09-23, baseline_start: 2023-04-11}
  - {season: 2023-24_winter, split: train, start: 2023-11-27, end: 2024-03-10, baseline_start: 2023-10-30}
  - {season: 2024_summer, split: train, start: 2024-05-09, end: 2024-09-23, baseline_start: 2024-04-11}
  - {season: 2024-25_winter, split: train, start: 2024-11-27, end: 2025-03-10, baseline_start: 2024-10-30}
  - {season: 2025_summer, split: train, start: 2025-05-09, end: 2025-09-23, baseline_start: 2025-04-11}
  - {season: 2025-26_winter, split: eval, start: 2025-11-27, end: 2026-03-10, baseline_start: 2025-10-30}
  - {season: 2026_summer, split: eval, start: 2026-05-09, end: 2026-09-23, baseline_start: 2026-04-11}

# 모델 세트 (노션 분석 설계 7.2, 11/25 결정). 폴더는 train/ = Train + Dev, eval/ = Test.
# 세 명 모두 src/io_utils.py 의 add_model_set() · load_processed() 로 붙여 쓴다.
model_sets:
  train: [2022-23_winter, 2023-24_winter, 2023_summer, 2024_summer]
  dev: [2024-25_winter, 2025_summer]
  test: [2025-26_winter, 2026_summer]

commute_hours: [8, 9, 18, 19, 20]
commute_hours_end:
  morning: [8, 9]
  evening: [18, 19, 20]

filters:
  weekdays_only: true
  exclude_korean_public_holidays: true
  holiday_calendar: holidays.KR
  summer_vacation_peak:
    status: confirmed
    start: 07-21
    end: 08-15
    decided: 2026-11-25 (A 분석 · B 확인)
    note: 여름 학습 3년(2023 · 2024 · 2025) 맑은 평일 출근 기준 안이 밖보다 3.3% 빠름 (해마다 -3.7 · -1.9 · -3.5%). 매년 같은 날짜, 평가 시즌은 보지 않고 정함.

time_definition:
  topis_label: interval_end
  example: "~08시 = 07:00-08:00"
  hour_24: next_day_00

thresholds:
  snow_temp_c: 1.0
  event_gap_h: 3
  snow_light_cm: 1.0
  snow_heavy_cm: 5.0
  rain_strong_mmh: 5.0
  rain_heavy_mmh: 30.0
  rain_heavy_total_mm: 80.0
  summer_day_mm: 30.0
  freezing_temp_c: 0.5
  impact_after_snow_h: 12
  impact_after_rain_h: 3
  congestion_link_ratio: 1.5
  congestion_road_length_ratio: 0.3   # 학습 후보 10·20·30·50% 중 구분력(악천후÷맑음 2.56배)과 정답 수(7,796행)의 균형 (outputs/tables/congestion_length_candidates_train.csv)

files:
  hourly: data/processed/{train,eval}/weather_hourly_{split}.csv
  events: data/processed/{train,eval}/weather_events_{split}.csv
  days: data/processed/{train,eval}/weather_days_{split}.csv
  warnings: data/processed/{train,eval}/weather_warnings_{split}.csv
