name: TOPIS 교통예보 매일 저장

# 매일 06:00 KST(= 전날 21:00 UTC)에 교통예보 스냅샷을 저장한다. 12/14까지 쓰고 끈다.
# 결과는 실행 기록의 첨부파일(artifact)로 남긴다. 저장소에 커밋하지 않는다.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [a-forecast]   # 시험 실행용. 확인되면 지운다
    paths: [crawling/topis_forecast.py, .github/workflows/topis_forecast.yml]

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install selenium requests pandas
      - run: python crawling/topis_forecast.py --out forecast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topis-forecast-${{ github.run_id }}
          path: |
            forecast/
            logs/kmj/topis_forecast.log
            logs/kmj/screenshots/forecast_*.png
          retention-days: 90
