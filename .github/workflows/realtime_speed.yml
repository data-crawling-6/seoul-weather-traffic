name: 실시간 속도 평일 출퇴근 저장

# 평일 출근(07 · 08시대) · 퇴근(17 · 18 · 19시대)에 시간마다 두 번(:20 · :45) 안정 링크 1,753개 속도를 저장한다.
# 정각은 예약이 밀리거나 빠질 수 있어 피했다. 실제 호출 시각은 파일에 남는다. 12/11까지 쓰고 끈다.
# 결과는 data-collect 브랜치의 data/raw/realtime_speed/날짜/에 커밋한다. main에는 커밋하지 않는다.
on:
  schedule:
    - cron: "20,45 22,23 * * 0-4"   # KST 월~금 07:20 · 07:45 · 08:20 · 08:45
    - cron: "20,45 8,9,10 * * 1-5"  # KST 월~금 17:20 ~ 19:45
  workflow_dispatch:
  push:
    branches: [a-realtime-speed]    # PR 브랜치 시험: 링크 20개만, 커밋 안 함

permissions:
  contents: write   # data-collect 브랜치에 결과를 커밋하려고

concurrency:
  group: realtime-speed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
    steps:
      - name: 수집 기간 확인
        id: period
        run: |
          if [ "$(date +%Y%m%d)" -gt 20261211 ]; then
            echo "12/11이 지나 수집하지 않음"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.period.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.period.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install requests
        if: steps.period.outputs.skip != 'true'
      - name: 수집
        if: steps.period.outputs.skip != 'true'
        env:
          SEOUL_OPEN_DATA_API_KEY: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python crawling/realtime_speed.py --out realtime --limit 20
          else
            python crawling/realtime_speed.py --out realtime
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.period.outputs.skip != 'true'
        with:
          name: realtime-speed-${{ github.run_id }}
          path: realtime/
          retention-days: 30
      - name: 결과를 data-collect 브랜치에 커밋
        if: success() && steps.period.outputs.skip != 'true' && github.event_name != 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin data-collect
          git worktree add -B data-collect ../collect FETCH_HEAD
          src="$PWD/realtime"
          cd ../collect
          msg="A chore: 실시간 속도 $(date '+%F %H:%M')"
          # 예보 수집과 같은 브랜치라 push가 부딪히면 최신을 새로 받아 다시 커밋한다
          for i in 1 2 3; do
            mkdir -p data/raw/realtime_speed
            cp -r "$src/." data/raw/realtime_speed/
            git add data/raw/realtime_speed
            git commit -q -m "$msg" || { echo "새 파일 없음"; exit 0; }
            git push origin data-collect && exit 0
            sleep $((i * 10))
            git fetch --depth 1 origin data-collect
            git reset -q --hard FETCH_HEAD
          done
          exit 1
